services:
  codexsecure:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codexsecure-api
    image: codexsecure-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - SERVER_PORT=8084
      - SERVER_HOST=0.0.0.0
      - ENV=${ENV:-production}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-codex_zones}
      - DB_USER=${DB_USER:-codex_zones_runtime}
      - DB_SSL_MODE=${DB_SSL_MODE:-prefer}
      - DB_MAX_CONNS=${DB_MAX_CONNS:-25}
      - DB_MIN_CONNS=${DB_MIN_CONNS:-5}
      # RESERVED / CURRENTLY UNUSED
      # These settings are loaded by the Go configuration
      # but have no runtime consumers as of November 2026.
      # Preserved for future CodexZone development.
      # Do not reactivate without verifying their implementation.
      #
      # ZONE_ROUTER_ID is also scheduled to be renamed
      # to BOUNDARY_ID when boundary configuration is implemented.
      # - ZONE_ROUTER_ID=${ZONE_ROUTER_ID:-Z0}
      # - ZONE_COUNT=${ZONE_COUNT:-12}
      # - ZONE_FRACTAL_DEPTH=${ZONE_FRACTAL_DEPTH:-12}
      # - PATTERN_CACHE_SIZE=${PATTERN_CACHE_SIZE:-10000}
      # - PATTERN_HASH_ALGORITHM=${PATTERN_HASH_ALGORITHM:-sha256}
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_NODE_SERVER_URL=${MCP_NODE_SERVER_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      # Signed TIU tokens (optional)
      - TIU_HMAC_SECRET=${TIU_HMAC_SECRET:-}
      - TIU_MAX_DRIFT_SECONDS=${TIU_MAX_DRIFT_SECONDS:-15}
      - TIU_MAX_FUTURE_SKEW_SECONDS=${TIU_MAX_FUTURE_SKEW_SECONDS:-2}
      # CodexHash API dependency
      - CODEXHASH_API_URL=${CODEXHASH_API_URL:-http://codexhash-api:8001}
      - CODEXHASH_ENABLED=${CODEXHASH_ENABLED:-true}
      - CODEXHASH_FAIL_OPEN=${CODEXHASH_FAIL_OPEN:-true}
      - CODEXHASH_TIMEOUT_SEC=${CODEXHASH_TIMEOUT_SEC:-3}
      # CodexTime API dependency
      - CODEXTIME_API_URL=${CODEXTIME_API_URL:-http://codextime-api:50002}
      - CODEXTIME_ENABLED=${CODEXTIME_ENABLED:-true}
      - CODEXTIME_FAIL_OPEN=${CODEXTIME_FAIL_OPEN:-true}
      - CODEXTIME_TIMEOUT_SEC=${CODEXTIME_TIMEOUT_SEC:-3}
      # Enable /health, /ready, /metrics web routes for Docker healthcheck
      - ENABLE_WEB_ROUTES=true
    env_file:
      - .env
    networks:
      - codex-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "/dev/null", "http://localhost:8084/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.web3connected.service=codexsecure"
      - "com.web3connected.version=1.0.0"
      - "com.web3connected.description=Security and encryption services"

networks:
  codex-net:
    external: true
