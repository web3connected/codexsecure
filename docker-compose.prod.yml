services:
  codexsecure-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codexsecure-api-prod
    image: codexsecure-api:prod
    restart: always
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8084
      - SERVER_HOST=0.0.0.0
      - ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8084/api/v1/status"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - codex-net
    labels:
      - "com.web3connected.service=codexsecure"
      - "com.web3connected.version=2.0.0"
      - "com.web3connected.description=Security and encryption services"
    depends_on:
      - codex-zone-mcp

  codex-zone-mcp:
    build:
      context: ../codex_zone_mcp
      dockerfile: Dockerfile
    container_name: codex-zone-mcp-prod
    image: codex-zone-mcp:prod
    restart: always
    ports:
      - "8085:8085"
    environment:
      - ZONE_MCP_PORT=8085
      - ZONE_SECRET_KEY=${ZONE_SECRET_KEY}
      - NODE_ENV=production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    networks:
      - codex-net
    labels:
      - "com.web3connected.service=codex-zone-mcp"
      - "com.web3connected.owner=codexsecure"

networks:
  codex-net:
    external: true
